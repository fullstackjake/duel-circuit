# Meson cross file: build the rules engine for 64-bit Windows from macOS (brew install mingw-w64). Used by
# tools/build_core.sh --windows.
[binaries]
c = 'x86_64-w64-mingw32-gcc'
cpp = 'x86_64-w64-mingw32-g++'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'

[built-in options]
# The DLL carries its own C++ runtime, so the game needs no MinGW DLLs next to it.
cpp_link_args = ['-static', '-static-libgcc', '-static-libstdc++']

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
