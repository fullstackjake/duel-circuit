name: Idea or feature request
description: Suggest something new or a way to make the game better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Short answers are fine.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to see in the game?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What would it make better or more fun? Is something annoying today?
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Examples, sketches, games that do it well. Please no card images.
  - type: checkboxes
    id: content
    attributes:
      label: Before you send
      options:
        - label: My idea has no card images or full-card screenshots.
          required: true
